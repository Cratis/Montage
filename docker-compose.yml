services:
  mongo:
    image: mongo:7
    container_name: motion-mongodb
    # Chronicle and the MongoDB change streams the editor's read models use both need a replica set
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - motion-mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 24

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      mongosh --host mongo --quiet --eval '
      try { rs.status().ok } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]}) }'

  chronicle:
    image: cratis/chronicle:latest-development-slim
    container_name: motion-chronicle
    ports:
      - "35000:35000"
    environment:
      Cratis__Chronicle__Storage__Type: mongodb
      Cratis__Chronicle__Storage__ConnectionDetails: "mongodb://mongo:27017/?directConnection=true"
    depends_on:
      mongo-init:
        condition: service_completed_successfully

volumes:
  motion-mongodb-data:
