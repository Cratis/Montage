name: Publish

# Keep every pending release in order: release-action releases one merged pull request per run, and the
# default concurrency keeps only one pending run and cancels the others (Cratis/Workflows#162).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: false
      release-notes:
        description: "Release notes"
        required: false
  # Releasing on push rather than on the pull_request closed event is deliberate. A pull request from a fork
  # runs with a read-only GITHUB_TOKEN and no secrets even on merge, so it cannot create the release or reach
  # the publishing credentials. A push to main always runs with a full-permission token, and the release
  # action finds the merged pull request and its label from the commit.
  push:
    branches:
      - main

# Creating the GitHub release needs a write-capable token.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The release action also comments on and closes the issues a release delivers.
    permissions:
      contents: write
      issues: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.should-publish }}
      reason: ${{ steps.release.outputs.reason }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Release
        id: release
        uses: cratis/release-action@v1
        with:
          version: ${{ github.event.inputs.version }}
          release-notes: ${{ github.event.inputs.release-notes }}

  publish-docker:
    if: needs.release.outputs.publish == 'true'
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            cratis/montage:${{ needs.release.outputs.version }}
            cratis/montage:latest
          build-args: |
            VERSION=${{ needs.release.outputs.version }}

  verify-published:
    # A merge that publishes nothing is the failure mode that silently costs a release: the release job
    # succeeds, every publish job is skipped for want of should-publish, and the whole run reports green. Fail
    # instead, so a release that did not happen cannot be mistaken for one that did. Only for the reasons that
    # mean something went wrong - publishing nothing is correct for a direct push, a Dependabot merge or a re-run.
    if: always() && needs.release.result == 'success' && contains(fromJSON('["no-label", "error"]'), needs.release.outputs.reason)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [release]

    steps:
      - name: Report that nothing was published
        run: |
          echo "::error::Nothing was published and no release was cut (reason: ${{ needs.release.outputs.reason }}). Add exactly one of major, minor or patch to the merged pull request and re-run this workflow."
          exit 1
