name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: "11.0.x"
  NODE_VERSION: "24.x"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Source/**"
      - "Docker/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Source/**"
      - "Docker/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  engine:
    name: Engine
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        working-directory: Source/Engine
        run: npm ci --no-audit --no-fund

      - name: Type check and build
        working-directory: Source/Engine
        run: npm run build

      # Uploaded so the backend job serves the same preview the engine job just verified.
      - name: Upload preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-preview
          path: Source/Engine/dist/preview
          retention-days: 1

  editor:
    name: Editor
    needs: [engine]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download engine preview
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: engine-preview
          path: Source/Engine/dist/preview

      - name: Install frontend dependencies
        working-directory: Source/Montage/.frontend
        run: npm install

      - name: Type check frontend
        working-directory: Source/Montage
        run: npm run compile

      - name: Build frontend
        working-directory: Source/Montage
        run: npm run build

      # The generated proxies are checked in, so the proxy generator stays off.
      - name: Build (Release - zero warnings)
        run: dotnet build Source/Montage/Montage.csproj --configuration Release -p:CratisProxiesOutputPath=

      - name: Build (Debug)
        run: dotnet build Source/Montage/Montage.csproj --configuration Debug -p:CratisProxiesOutputPath=

  # The image is what actually ships, and nothing else verifies it until Publish tries to push one.
  # Build it here (native architecture, no push; Publish does the multi-arch build) so a broken
  # image fails on the pull request instead.
  docker-build:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Docker/Dockerfile
          push: false
          build-args: |
            VERSION=0.0.0-ci
