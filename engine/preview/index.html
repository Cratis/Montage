<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>motion-engine preview</title>
  <style>
    @font-face { font-family: 'Inter'; src: url('/fonts/inter.woff2') format('woff2'); font-weight: 100 900; font-style: normal; font-display: block; }
    @font-face { font-family: 'JetBrains Mono'; src: url('/fonts/jetbrains.woff2') format('woff2'); font-weight: 100 800; font-style: normal; font-display: block; }
    @font-face { font-family: 'Space Grotesk'; src: url('/fonts/space-grotesk.woff2') format('woff2'); font-weight: 500 700; font-style: normal; font-display: block; }
    html, body { margin: 0; height: 100%; background: #0b0d12; overflow: hidden; }
    body { display: grid; place-items: center; }
    #stage { position: relative; }
    canvas#c { display: block; width: 100%; height: 100%; }
    #error { position: fixed; inset: 0; display: none; place-items: center; color: #f0eee6; font: 14px/1.6 "JetBrains Mono", monospace; white-space: pre-wrap; padding: 40px; }
  </style>
</head>
<body>
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="error"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
